name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install libs
        run: |
          haxelib install lime 7.9.0 --always
          haxelib install hxcpp 4.2.1 --always

      - name: Build (hxcpp -> MSVC)
        run: haxelib run lime build windows -release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: GLSpeaker-windows-x64
          path: export/windows/bin/

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install libs
        run: haxelib install lime 7.9.0 --always

      - name: Build html5
        run: haxelib run lime build html5

      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: GLSpeaker-web
          path: export/html5/bin/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install libs
        run: |
          haxelib install lime 7.9.0 --always
          haxelib install hxcpp 4.2.1 --always

      - name: Ensure NDK (direct download, bypass sdkmanager)
        run: |
          curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          mkdir -p /opt/ndk && unzip -q /tmp/ndk.zip -d /opt/ndk
          echo "ANDROID_NDK_ROOT=/opt/ndk/android-ndk-r21e" >> $GITHUB_ENV

      - name: Build APK
        run: haxelib run lime build android -release
        env:
          ANDROID_SETUP: 1
          ANDROID_SDK: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: /opt/ndk/android-ndk-r21e

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GLSpeaker-android
          path: export/android/bin/*.apk
